<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Signup | SickleCare</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/script.js"></script>
  </head>
  <body data-page="doctorSignup">
    <header id="navbar"></header>
    <main class="container">
      <div class="card form-card">
        <h2>Doctor Signup</h2>
        <form id="doctorSignup" class="grid">
          <label>
            <span>Full Name</span>
            <input name="fullName" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" minlength="6" required />
          </label>
          <label>
            <span>Hospital Name</span>
            <input name="hospitalName" required />
          </label>
          <label>
            <span>License Number</span>
            <input name="licenseNumber" required />
          </label>
          <label>
            <span>Specialty</span>
            <input name="specialty" required />
          </label>
          <label>
            <span>Location</span>
            <input name="location" required />
          </label>
          <label>
            <span>Years of Experience</span>
            <input type="number" name="experience" min="0" required />
          </label>
          <div class="actions full">
            <button class="button primary" type="submit">Create Account</button>
            <a class="button" href="./doctor-login.html"
              >Have an account? Log in</a
            >
          </div>
        </form>
      </div>
    </main>
    <script src="../js/routing.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
